[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hw-toolkit"
version = "0.1.0"
description = "Hardware design agent + MCP servers (designer, router, live-edit)."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0",
    "fastmcp>=0.1",
    "pydantic>=2.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "watchdog>=4.0",
    "pyyaml>=6.0",
    "pcborder @ file:///Users/juanantonioluera/ws/freight_flow_ai/hardware/pcborder",
]

[project.scripts]
designer-mcp = "mcp_server.designer.server:main"
router-mcp   = "mcp_server.router.server:main"
live-edit-mcp = "mcp_server.live_edit.server:main"
hw-vis        = "hw_agent.visualizer.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hw_agent*", "mcp_server*"]
