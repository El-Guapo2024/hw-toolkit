[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hw-router-service"
version = "0.1.0"
description = "Hosted FreeRouting microservice — POST DSN, get SES."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "rq>=2.0",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
hw-router-service = "hw_router_service.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hw_router_service*"]

[tool.setuptools.package-dir]
"" = "src"
