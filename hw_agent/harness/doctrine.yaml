# Doctrine rules for the hardware-agent harness.
#
# Each rule entry:
#   id           short identifier (snake_case)
#   text         human-readable rule. Appears in both soft injection and hard rejection.
#   soft.stages  list of stages where the rule injects into context. "*" = all stages.
#   hard.tool    tool name (or list) the validator applies to (PreToolUse).
#   hard.when    optional Python expression evaluated against tool args.
#                Allowed names: tool-arg keys + len/any/all. No builtins, no imports.
#   hard.validator  function name in hw_agent.harness.validators.REGISTRY.
#
# Loader filters in two modes:
#   - rules_for_stage(stage)        → main agent soft injection (mode B)
#   - rules_for_tools(allow_list)   → sub-agent soft injection (mode C)
#   - rules_for_tool_call(tool)     → hard enforcement at PreToolUse

version: 1

rules:

  - id: load_first
    text: "Lock loads (actuators, sensors, MCU) before sizing power rails. Loads drive the current budget."
    soft:
      stages: [intake, spec]
    hard:
      tool: subsystem_add
      when: "category in ('buck_converter', 'ldo')"
      validator: assert_all_loads_locked

  # Soft-only: tool surface lacks dedicated fields. Reminder appears each turn;
  # AI captures evidence in rationale prose. Promote to hard once designer-mcp
  # grows first-class fields (design_pass, datasheet_section_ref).
  - id: pass1_no_math
    text: "Pass 1 = copy datasheet typical-app BOM verbatim. No calculations, no derived values. Cite page in rationale (e.g. 'p.34 typical app')."
    soft:
      stages: [designer]

  # Soft-only: same reason. Capture DK stock + part code in rationale prose.
  - id: digikey_primary
    text: "Check Digi-Key stock first (DK > JLC > Mouser). Note DK part + stock qty in rationale. JLC fallback only with written justification."
    soft:
      stages: [designer]

  - id: bom_ceiling
    text: "Running BOM total per board must stay at or below the project ceiling."
    soft:
      stages: [designer, pcb]
    hard:
      tool: subsystem_choose_part
      validator: assert_bom_under_ceiling
